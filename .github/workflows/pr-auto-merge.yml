name: PR Auto Merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read
  actions: write
  statuses: read

concurrency:
  group: pr-auto-merge-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  merge-if-green:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve exact PR head and verify CI
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          pulls="$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls")"
          pr_json="$(jq --arg sha "$HEAD_SHA" '[.[] | select(.state == "open") | select(.head.repo.full_name == .base.repo.full_name) | select(.base.ref == "main") | select(.head.sha == $sha)][0]' <<<"$pulls")"
          if [ "$pr_json" = "null" ]; then
            merged_json="$(jq --arg sha "$HEAD_SHA" '[.[] | select(.merged_at != null) | select(.head.repo.full_name == .base.repo.full_name) | select(.base.ref == "main") | select(.head.sha == $sha)][0]' <<<"$pulls")"
            if [ "$merged_json" != "null" ]; then
              merged_main_sha="$(jq -r '.merge_commit_sha // empty' <<<"$merged_json")"
              if [ -n "$merged_main_sha" ]; then
                echo "merged_main_sha=$merged_main_sha" >> "$GITHUB_OUTPUT"
              fi
            fi
            exit 0
          fi
          pr_number="$(jq -r '.number' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref' <<<"$pr_json")"
          runs="$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&event=pull_request&per_page=100")"
          latest="$(jq '[.workflow_runs[] | select(.name == "CI")] | sort_by(.created_at) | last' <<<"$runs")"
          jq -e '. != null and .status == "completed" and .conclusion == "success"' <<<"$latest" >/dev/null
          checks="$(gh api "repos/$REPO/commits/$HEAD_SHA/check-runs?filter=latest&per_page=100")"
          jq -e '(.total_count > 0) and all(.check_runs[]; .status == "completed" and (.conclusion == "success" or .conclusion == "skipped" or .conclusion == "neutral"))' <<<"$checks" >/dev/null
          statuses="$(gh api "repos/$REPO/commits/$HEAD_SHA/status")"
          jq -e '(.statuses | length == 0) or .state == "success"' <<<"$statuses" >/dev/null
          current_pr="$(gh api "repos/$REPO/pulls/$pr_number")"
          jq -e --arg sha "$HEAD_SHA" '.state == "open" and .base.ref == "main" and .head.sha == $sha and .head.repo.full_name == .base.repo.full_name' <<<"$current_pr" >/dev/null
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Merge validated PR
        id: merge
        if: steps.gate.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.gate.outputs.pr_number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_REF: ${{ steps.gate.outputs.head_ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          result="$(gh api -X PUT "repos/$REPO/pulls/$PR_NUMBER/merge" -f merge_method=squash -f sha="$HEAD_SHA")"
          jq -e '.merged == true' <<<"$result" >/dev/null
          merged_main_sha="$(jq -r '.sha // empty' <<<"$result")"
          test -n "$merged_main_sha"
          echo "merged_main_sha=$merged_main_sha" >> "$GITHUB_OUTPUT"
          gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" >/dev/null 2>&1 || true

      - name: Re-validate merged main at its exact SHA
        if: steps.gate.outputs.pr_number != '' || steps.gate.outputs.merged_main_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MERGED_SHA: ${{ steps.merge.outputs.merged_main_sha || steps.gate.outputs.merged_main_sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sha="$MERGED_SHA"
          test -n "$sha"
          current_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          if [ "$current_main" != "$sha" ]; then
            echo "Main advanced to $current_main; refusing to revalidate stale merge $sha."
            exit 0
          fi
          existing="$(gh api "repos/$REPO/actions/runs?head_sha=$sha&event=workflow_dispatch&per_page=100")"
          if jq -e '.workflow_runs[] | select(.path == ".github/workflows/ci.yml")' <<<"$existing" >/dev/null; then
            echo "CI already dispatched for main@$sha"
            exit 0
          fi
          gh api --method POST "repos/$REPO/actions/workflows/ci.yml/dispatches" -f ref=main
