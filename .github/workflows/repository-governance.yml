name: Repository Governance Gate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance-gate:
    runs-on: [self-hosted, Linux, ARM64, solange-rolla-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate governance contract
        run: bash scripts/repository-governance-validate.sh ci
