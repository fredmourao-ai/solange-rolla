name: Legacy Static Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  static-smoke:
    runs-on: [self-hosted, Linux, ARM64, solange-rolla-ci]
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify repository is superseded
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'REPOSITÓRIO HISTÓRICO / SUPERSEDIDO' README.md
          grep -Fq 'fredmourao-ai/solange-rolla-consultorio' README.md
          echo LEGACY_REPOSITORY_STATIC_SMOKE=PASS
